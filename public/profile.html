<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#04060c" />
<meta name="description" content="HOME-GYM · Profilo atleta: username, stato e obiettivo giornaliero." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="HOME-GYM" />
<meta name="color-scheme" content="dark" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>Profilo · HOME-GYM</title>
<link rel="stylesheet" href="app.css?v=4" />
</head>
<body data-page="profile">
<div id="app">
  <div class="topbar"><a class="back glass" href="index.html" aria-label="Torna alla Home">‹</a><div class="logo">👤 HOME-<span>GYM</span></div><div class="streak-pill" id="streakPill">🔥 0</div></div>
  <div id="banner" class="hidden card warn"></div>
  <h1>Profilo e <span class="glow-cyan">obiettivi.</span></h1>
  <div class="card hero"><span class="lbl">Atleta</span><b id="pfNameBig" style="font-size:clamp(30px,9vw,42px)">Atleta</b><div class="meta" id="pfMeta"></div></div>
  <div class="grid3">
    <div class="kpi"><b id="pfStreak">0🔥</b><small>streak gg</small></div>
    <div class="kpi"><b id="pfEntries">0</b><small>serie mie</small></div>
    <div class="kpi pr"><b id="pfBest">0</b><small>PR max</small></div>
  </div>
  <h2>✏️ Dati atleta</h2>
  <div class="card">
    <label class="mu" style="font-size:12px;font-weight:700">Username * (come appari in classifica)</label>
    <input id="pfUsername" type="text" maxlength="30" placeholder="es. marco84" style="width:100%;margin:6px 0 12px;min-height:52px;font-weight:800" />
    <label class="mu" style="font-size:12px;font-weight:700">Stato *</label>
    <select id="pfCountry" style="width:100%;margin:6px 0 12px;min-height:52px;font-weight:700"></select>
    <label class="mu" style="font-size:12px;font-weight:700">Nome visualizzato</label>
    <input id="pfName" type="text" maxlength="60" style="width:100%;margin:6px 0 12px;min-height:52px" />
    <label class="mu" style="font-size:12px;font-weight:700">Obiettivo giornaliero globale</label>
    <input id="pfGoal" type="number" min="10" max="100000" style="width:100%;margin:6px 0 12px;min-height:52px;font-weight:800" />
    <button class="pri" onclick="saveProfile()">💾 Salva profilo</button>
    <p class="mu" style="font-size:11px;margin-top:8px">Gli obiettivi smart per singolo esercizio si impostano dentro ogni scheda (🤖 Auto / ✏️ Manuale).</p>
  </div>
</div>
<nav class="tabbar"><div>
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="stats.html"><span>📊</span>Stats</a>
  <a href="profile.html" class="on"><span>👤</span>Profilo</a>
  <a href="rank.html"><span>🏆</span>Rank</a>
</div></nav>
<div id="toast"></div>
<script src="app.js?v=14"></script>
</body>
</html>
