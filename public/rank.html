<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#04060c" />
<meta name="description" content="HOME-GYM · Classifiche globali: volume, PR e streak su tutti gli esercizi." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="HOME-GYM" />
<meta name="color-scheme" content="dark" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>Classifiche · HOME-GYM</title>
<link rel="stylesheet" href="app.css?v=4" />
</head>
<body data-page="rank">
<div id="app">
  <div class="topbar"><a class="back glass" href="index.html" aria-label="Torna alla Home">‹</a><div class="logo">🏆 HOME-<span>GYM</span></div><div class="streak-pill" id="streakPill">🔥 0</div></div>
  <div id="banner" class="hidden card warn"></div>
  <h1>Sfida il <span class="glow-cyan">mondo.</span></h1>
  <div class="card"><div class="mu" style="font-size:11px">ESERCIZIO (TUTTI E 4)</div>
    <select id="rankExG" onchange="loadRank()" style="width:100%;margin-top:6px;min-height:50px;font-weight:700"></select>
    <div class="mu" style="font-size:11px;margin-top:12px">METRICA</div><div class="chips" style="margin-top:6px"><button id="mVol" class="chipbtn" onclick="setMetric('volume')">📦 Volume</button><button id="mPr" class="chipbtn" onclick="setMetric('pr')">🏆 PR</button><button id="mStreak" class="chipbtn" onclick="setMetric('streak')">🔥 Streak</button></div>
    <div class="mu" style="font-size:11px">AMBITO</div><div class="chips" style="margin-top:6px"><button id="gGlobal" class="chipbtn" onclick="setScope('global')">🌍</button><button id="gCountry" class="chipbtn" onclick="setScope('country')">🇮🇹</button><button id="gRoom" class="chipbtn" onclick="setScope('room')">🔒</button></div>
    <div id="periodBlock"><div class="mu" style="font-size:11px">PERIODO</div><div class="chips" style="margin-top:6px"><button id="gToday" class="chipbtn" onclick="setPeriod('today')">Oggi</button><button id="gWeek" class="chipbtn" onclick="setPeriod('week')">Settimana</button><button id="gAll" class="chipbtn" onclick="setPeriod('all')">Sempre</button></div></div>
    <div id="roomPanel" class="hidden"></div>
    <p class="mu" id="rankLabel" style="font-size:11px;margin-top:8px"></p>
    <div class="card" style="padding:6px 14px;margin:8px 0 0"><div id="rankList"></div></div>
  </div>
</div>
<nav class="tabbar"><div>
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="stats.html"><span>📊</span>Stats</a>
  <a href="profile.html"><span>👤</span>Profilo</a>
  <a href="rank.html" class="on"><span>🏆</span>Rank</a>
</div></nav>
<div id="toast"></div>
<script src="app.js?v=10"></script>
</body>
</html>
